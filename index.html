<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>යාලුවෝ Chat</title>
    <style>
    body { 
        font-family: Arial, sans-serif; 
        background: #f0f2f5; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
        padding: 0;
        box-sizing: border-box;
    }
    
    /* Login & Sign Up Screen Styles */
    .auth-container { 
        width: 100%; 
        max-width: 380px; 
        background: white; 
        padding: 30px 25px; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        text-align: center; 
        margin: 20px;
        box-sizing: border-box;
    }
    #signUpScreen { display: none; }

    .auth-container h2 { color: #007bff; margin-bottom: 25px; font-size: 1.6rem; }
    .auth-container input { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 15px; 
        border: 1px solid #ddd; 
        border-radius: 6px; 
        outline: none; 
        font-size: 1rem; 
        box-sizing: border-box; 
    }
    
    .auth-container button { 
        width: 100%; 
        border: none; 
        padding: 12px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-size: 1rem; 
        font-weight: bold; 
        color: white;
        transition: background 0.2s; 
    }
    
    #startChatBtn { background: #007bff; }
    #startChatBtn:hover { background: #0056b3; }
    #submitSignUpBtn { background: #28a745; }
    #submitSignUpBtn:hover { background: #218838; }
    
    .auth-toggle-text { margin-top: 20px; font-size: 0.9rem; color: #555; }
    .auth-toggle-text a { color: #007bff; text-decoration: none; font-weight: bold; cursor: pointer; }
    .auth-toggle-text a:hover { text-decoration: underline; }

    /* Chat Screen */
    .chat-container { 
        width: 100%; 
        max-width: 600px; 
        height: 85vh; 
        max-height: 800px;
        background: white; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        border-radius: 12px; 
        display: none; 
        flex-direction: column; 
        overflow: hidden; 
        margin: 20px; 
    }
    
    /* 🛠️ වෙනස් කරන ලද Header එක (Profile බටන් එක සහිතව) */
    .chat-header { 
        background: #007bff; 
        color: white; 
        padding: 12px 18px; 
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2rem; 
        font-weight: bold; 
    }
    
    .header-profile {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.18);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        transition: 0.2s;
    }
    .header-profile:hover { background: rgba(255, 255, 255, 0.3); }
    
    .header-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        color: #007bff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
    }

    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #f8fafc; }
    
    /* Message Rows */
    .msg-row { display: flex; width: 100%; position: relative; margin-bottom: 10px; }
    .msg-row.incoming { justify-content: flex-start; }
    .msg-row.outgoing { flex-direction: row-reverse; }

    .profile-area { width: 42px; display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; }
    
    /* 🖼️ Chat එක ඇතුලෙ පෙනෙන පින්තූර/මුල් අකුරු වල Styles */
    .avatar-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 3; }
    .avatar-txt { width: 36px; height: 36px; border-radius: 50%; background: #007bff; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.95rem; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 3; }
    
    .timeline-line { position: absolute; top: 0px; bottom: -18px; width: 3px; background: #cbd5e1; z-index: 1; display: none; }
    .msg-row.has-next .timeline-line { display: block; }

    .msg-content { max-width: 75%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-left: 8px; }
    .msg-row.outgoing .msg-content { align-items: flex-end; margin-left: 0; margin-right: 8px; }
    
    .sender-name-bubble { font-size: 0.8rem; font-weight: bold; color: white; padding: 3px 8px; border-radius: 4px; background: #475569; z-index: 2; margin-bottom: 2px; }
    .msg-row.outgoing .sender-name-bubble { background: #334155; }
    .msg-row.consecutive .sender-name-bubble { display: none; }

    .bubble { padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; color: white; display: inline-block; word-wrap: break-word; z-index: 2; margin-top: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg-row.incoming .bubble { background: #6c757d; }
    .msg-row.outgoing .bubble { background: #007bff; }
    
    .chat-media { max-width: 100%; max-height: 250px; border-radius: 8px; display: block; margin-top: 5px; cursor: pointer; }
    
    .msg-row.consecutive .profile-area .avatar-img, .msg-row.consecutive .profile-area .avatar-txt { display: none; } 
    .msg-row.consecutive .msg-content { margin-top: -15px; }
    
    .msg-time { font-size: 0.7rem; color: #888; margin-top: 2px; margin-bottom: 5px; }
    .msg-row.outgoing .msg-time { text-align: right; }

    .input-area { padding: 12px; display: flex; align-items: center; gap: 8px; background: #fff; border-top: 1px solid #ddd; }
    .action-btn { background: #e4e6eb; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; transition: background 0.2s; flex-shrink: 0; }
    .action-btn:hover { background: #d8dadf; }
    .send-btn { background: #007bff; color: white; font-weight: bold; }
    .send-btn:hover { background: #0056b3; }

    /* 📌 PROFILE EDIT MODAL STYLES (POP-UP BOX) */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .profile-modal {
        background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 360px;
        text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: relative;
    }
    .modal-close { position: absolute; top: 12px; right: 15px; font-size: 1.4rem; cursor: pointer; color: #888; }
    .modal-avatar-view {
        width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
        margin: 10px auto; border: 3px solid #007bff; display: block; background: #eee;
    }
    .modal-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .save-profile-btn { background: #007bff; color: white; }
    .logout-btn { background: #dc3545; color: white; margin-top: 15px; }

    /* MOBILE PHONES (RESPONSIVE) */
    @media (max-width: 576px) {
        body { background: white; align-items: flex-start; } 
        
        .auth-container { 
            box-shadow: none; margin: 0; padding: 20px; max-width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: center;
        }
        
        .chat-container { width: 100vw; height: 100vh; max-height: 100vh; margin: 0; border-radius: 0; }
        .chat-header { padding: 10px 15px; font-size: 1.1rem; border-radius: 0; }
        .messages-box { padding: 10px; }
        .msg-content { max-width: 85%; } 
        .chat-media { max-width: 180px; max-height: 180px; }
        .input-area { padding: 8px; }
    }
</style>
</head>
<body>

<div class="auth-container" id="loginScreen">
    <h2>යාලුවෝ Chat - Log In 💬</h2>
    <input type="email" id="loginEmail" placeholder="ඔයාගේ Email එක..." required>
    <input type="password" id="loginPassword" placeholder="මුද්‍රිත පදය (Password)..." required>
    <button id="startChatBtn">Log In වෙන්න</button>
    <div class="auth-toggle-text">
        Account එකක් නැද්ද? <a id="goToSignUp">ලියාපදිංචි වෙන්න (Sign Up)</a>
    </div>
</div>

<div class="auth-container" id="signUpScreen">
    <h2>යාලුවෝ Chat - Sign Up ✨</h2>
    <input type="email" id="signUpEmail" placeholder="නව Email ලිපිනයක්..." required>
    <input type="password" id="signUpPassword" placeholder="නව මුද්‍රිත පදයක් (Password)..." required>
    <input type="password" id="signUpConfirmPassword" placeholder="මුද්‍රිත පදය නැවත ඇතුළත් කරන්න..." required>
    <button id="submitSignUpBtn">Account එක හදන්න</button>
    <div class="auth-toggle-text">
        දැනටමත් Account එකක් තියෙනවද? <a id="goToLogin">Log In වෙන්න</a>
    </div>
</div>

<div class="chat-container" id="chatScreen">
    <div class="chat-header">
        <span>යාලුවෝ Chat Box 💬</span>
        <div class="header-profile" id="headerProfileBtn">
            <span id="headerName">User</span>
            <div id="headerAvatarContainer"></div>
        </div>
    </div>
    <div class="messages-box" id="messages"></div>
    
    <div class="input-area">
        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
        
        <button class="action-btn" id="attachBtn" title="Media Upload">📎</button>
        <button class="action-btn" id="camBtn" title="Open Camera">📷</button>
        
        <input type="text" id="messageInput" placeholder="මැසේජ් එකක් ලියන්න..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none;">
        <button class="action-btn send-btn" id="sendBtn">➤</button>
    </div>
</div>

<div class="modal-overlay" id="profileModalOverlay">
    <div class="profile-modal">
        <span class="modal-close" id="closeModalBtn">&times;</span>
        <h3>මගේ Profile විස්තර ⚙️</h3>
        <img src="" id="modalAvatarPreview" class="modal-avatar-view" alt="Profile Picture">
        
        <input type="file" id="profilePicInput" accept="image/*" style="display: none;">
        <button class="modal-btn" style="background: #e4e6eb; color: #333;" onclick="document.getElementById('profilePicInput').click()">ඡායාරූපයක් තෝරන්න 📷</button>
        
        <input type="text" id="profileNameInput" placeholder="ඔයාගේ නම..." style="margin-top:15px; padding:10px; width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:6px;">
        <button class="modal-btn save-profile-btn" id="saveProfileBtn">විස්තර සුරකින්න (Save)</button>
        
        <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">
        <button class="modal-btn logout-btn" id="logoutBtn">Log Out වෙන්න 🚪</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdXSYW5R4zRhC2WIYvlRXjAPHftDvcB30",
    authDomain: "testing-1-fe6c8.firebaseapp.com",
    databaseURL: "https://testing-1-fe6c8-default-rtdb.firebaseio.com/",
    projectId: "testing-1-fe6c8",
    storageBucket: "testing-1-fe6c8.firebasestorage.app", 
    messagingSenderId: "111355439434",
    appId: "1:111355439434:web:7b2615b3b2064b6d4df9b3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app); 
  const auth = getAuth(app); 
  const messagesRef = ref(db, 'messages');

  let currentUserUID = ""; 
  let myName = "";
  let myPhotoURL = "";
  let lastSenderUID = ""; 
  let lastRowElement = null;

  function getNameColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
    const colors = ['#dc3545', '#fd7e14', '#6f42c1', '#e83e8c', '#17a2b8', '#20c997', '#28a745'];
    return colors[Math.abs(hash) % colors.length];
  }

  // DOM Elements
  const loginScreen = document.getElementById('loginScreen');
  const signUpScreen = document.getElementById('signUpScreen');
  const chatScreen = document.getElementById('chatScreen');
  const profileModalOverlay = document.getElementById('profileModalOverlay');
  
  const headerName = document.getElementById('headerName');
  const headerAvatarContainer = document.getElementById('headerAvatarContainer');
  const modalAvatarPreview = document.getElementById('modalAvatarPreview');
  const profileNameInput = document.getElementById('profileNameInput');
  const profilePicInput = document.getElementById('profilePicInput');
  
  const loginEmailInput = document.getElementById('loginEmail');
  const loginPasswordInput = document.getElementById('loginPassword');
  const signUpEmailInput = document.getElementById('signUpEmail');
  const signUpPasswordInput = document.getElementById('signUpPassword');
  const signUpConfirmPasswordInput = document.getElementById('signUpConfirmPassword');
  
  const startChatBtn = document.getElementById('startChatBtn');
  const submitSignUpBtn = document.getElementById('submitSignUpBtn');
  
  const goToSignUp = document.getElementById('goToSignUp');
  const goToLogin = document.getElementById('goToLogin');

  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const messagesBox = document.getElementById('messages');
  const mediaInput = document.getElementById('mediaInput');
  const cameraInput = document.getElementById('cameraInput');
  const attachBtn = document.getElementById('attachBtn');
  const camBtn = document.getElementById('camBtn');

  // UI මාරු කරන ලොජික් (Toggle Screens)
  goToSignUp.addEventListener('click', () => { loginScreen.style.display = "none"; signUpScreen.style.display = "block"; });
  goToLogin.addEventListener('click', () => { signUpScreen.style.display = "none"; loginScreen.style.display = "block"; });
  
  // Modal Open/Close ලොජික්
  document.getElementById('headerProfileBtn').addEventListener('click', () => {
      profileNameInput.value = myName;
      modalAvatarPreview.src = myPhotoURL ? myPhotoURL : "https://via.placeholder.com/90?text=" + myName.charAt(0).toUpperCase();
      profileModalOverlay.style.display = "flex";
  });
  document.getElementById('closeModalBtn').addEventListener('click', () => { profileModalOverlay.style.display = "none"; });

  // Auto Login Check
  onAuthStateChanged(auth, (user) => {
      if (user) {
          currentUserUID = user.uid; 
          myName = user.displayName ? user.displayName : user.email.split('@')[0];
          myPhotoURL = user.photoURL ? user.photoURL : "";

          headerName.innerText = myName;
          if(myPhotoURL) {
              headerAvatarContainer.innerHTML = `<img src="${myPhotoURL}" class="header-avatar">`;
          } else {
              headerAvatarContainer.innerHTML = `<div class="header-avatar">${myName.charAt(0).toUpperCase()}</div>`;
          }

          loginScreen.style.display = "none";
          signUpScreen.style.display = "none";
          chatScreen.style.display = "flex";
          loadChatMessages(); 
      } else {
          loginScreen.style.display = "block";
          signUpScreen.style.display = "none";
          chatScreen.style.display = "none";
          profileModalOverlay.style.display = "none";
      }
  });

  // LOG IN LOGIC
  startChatBtn.addEventListener('click', () => {
     const email = loginEmailInput.value.trim();
     const password = loginPasswordInput.value.trim();
     if(email !== "" && password !== "") {
         startChatBtn.disabled = true; startChatBtn.innerText = "Loggin in... ⏳";
         signInWithEmailAndPassword(auth, email, password).catch((error) => {
              alert("ඇතුළත් කළ Email හෝ Password වැරදියි! ❌");
              startChatBtn.disabled = false; startChatBtn.innerText = "Log In වෙන්න";
         });
     } else { alert("කරුණාකර Email සහ Password ඇතුළත් කරන්න!"); }
  });

  // SIGN UP LOGIC
  submitSignUpBtn.addEventListener('click', () => {
     const email = signUpEmailInput.value.trim();
     const password = signUpPasswordInput.value.trim();
     const confirmPassword = signUpConfirmPasswordInput.value.trim();

     if(email !== "" && password !== "" && confirmPassword !== "") {
         if(password.length < 6) { alert("Password එකට අවම වශයෙන් අක්ෂර 6ක්වත් තියෙන්න ඕනේ!"); return; }
         if(password !== confirmPassword) { alert("ඇතුළත් කළ Password දෙක එකිනෙකට ගැලපෙන්නේ නැත! ❌"); return; }

         submitSignUpBtn.disabled = true; submitSignUpBtn.innerText = "Creating Account... ⏳";
         createUserWithEmailAndPassword(auth, email, password).then(() => { alert("Account එක සාර්ථකව සෑදුවා! 🎉"); })
          .catch((error) => {
              if (error.code === 'auth/email-already-in-use') { alert("මේ Email එකෙන් දැනටමත් Account එකක් හදලයි තියෙන්නේ! ❌"); } 
              else { alert("Account එක හදන්න බැරි වුණා: " + error.message); }
              submitSignUpBtn.disabled = false; submitSignUpBtn.innerText = "Account එක හදන්න";
          });
     } else { alert("කරුණාකර සියලුම විස්තර නිවැරදිව පුරවන්න!"); }
  });

  // 🚪 LOG OUT LOGIC
  document.getElementById('logoutBtn').addEventListener('click', () => {
      if(confirm("ඔයාට ඇත්තටම Log Out වෙන්න ඕනෙද?")) {
          signOut(auth).then(() => { location.reload(); });
      }
  });

  // 🎯 PROFILE UPDATE LOGIC (ඡායාරූප සහ නම සුරැකීම)
  document.getElementById('saveProfileBtn').addEventListener('click', async () => {
      const newName = profileNameInput.value.trim();
      if(!newName) return alert("නම හිස්ව තැබිය නොහැක!");
      
      const saveBtn = document.getElementById('saveProfileBtn');
      saveBtn.disabled = true; saveBtn.innerText = "Saving... ⏳";

      let finalPhotoURL = myPhotoURL;
      const file = profilePicInput.files[0];

      if(file) {
          try {
              const fileRef = sRef(storage, `profile_pics/${currentUserUID}`);
              const snapshot = await uploadBytes(fileRef, file);
              finalPhotoURL = await getDownloadURL(snapshot.ref);
          } catch(e) { console.error("Image upload failed", e); }
      }

      updateProfile(auth.currentUser, {
          displayName: newName,
          photoURL: finalPhotoURL
      }).then(() => {
          alert("Profile එක සාර්ථකව වෙනස් කලා! 🎉");
          profileModalOverlay.style.display = "none";
          location.reload(); 
      }).catch((e) => { alert(e.message); saveBtn.disabled = false; saveBtn.innerText = "Save"; });
  });

  profilePicInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(file) { modalAvatarPreview.src = URL.createObjectURL(file); }
  });

  // CHAT MESSAGES LOGIC
  function sendMessage() {
    const text = messageInput.value.trim();
    if (text !== "" && currentUserUID !== "") {
        push(messagesRef, {
            senderUID: currentUserUID, 
            senderName: myName, 
            senderPhoto: myPhotoURL, // ඩේටාබේස් එකට Profile Pic එකත් යවයි
            message: text,
            type: "text",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        messageInput.value = "";
    }
  }

  async function handleFileUpload(file) {
    if (!file || currentUserUID === "") return;
    const fileType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'unknown';
    if (fileType === 'unknown') return;

    const loadingId = Date.now();
    messageInput.value = "Uploading file... ⏳"; messageInput.disabled = true;

    try {
        const fileRef = sRef(storage, `chat_media/${loadingId}_${file.name}`);
        const snapshot = await uploadBytes(fileRef, file);
        const downloadURL = await getDownloadURL(snapshot.ref);

        push(messagesRef, {
            senderUID: currentUserUID,
            senderName: myName,
            senderPhoto: myPhotoURL,
            message: downloadURL, 
            type: fileType,       
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    } catch (error) { console.error("Upload error: ", error); } 
    finally { messageInput.value = ""; messageInput.disabled = false; messageInput.focus(); }
  }

  attachBtn.addEventListener('click', () => mediaInput.click());
  camBtn.addEventListener('click', () => cameraInput.click());
  mediaInput.addEventListener('change', (e) => { handleFileUpload(e.target.files[0]); e.target.value = ''; });
  cameraInput.addEventListener('change', (e) => { handleFileUpload(e.target.files[0]); e.target.value = ''; });
  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  function loadChatMessages() {
    messagesBox.innerHTML = ""; lastSenderUID = ""; lastRowElement = null;

    onChildAdded(messagesRef, (data) => {
        const msgData = data.val();
        const msgSenderUID = msgData.senderUID ? msgData.senderUID : msgData.sender;
        const currentSenderName = msgData.senderName ? msgData.senderName : msgData.sender;
        const currentSenderPhoto = msgData.senderPhoto ? msgData.senderPhoto : "";
        const isMe = msgSenderUID === currentUserUID;

        const rowDiv = document.createElement('div');
        rowDiv.className = `msg-row ${isMe ? 'outgoing' : 'incoming'}`;
        
        const profileDiv = document.createElement('div');
        profileDiv.className = 'profile-area';
        
        // 🖼️ මැසේජ් එක ළඟ පින්තූරය හෝ අකුර පෙන්වීම
        if(currentSenderPhoto) {
            profileDiv.innerHTML = `<img src="${currentSenderPhoto}" class="avatar-img">`;
        } else {
            const avatar = document.createElement('div');
            avatar.className = 'avatar-txt';
            avatar.innerText = currentSenderName.charAt(0).toUpperCase();
            if(!isMe) avatar.style.backgroundColor = getNameColor(currentSenderName.toLowerCase());
            profileDiv.appendChild(avatar);
        }
        
        const line = document.createElement('div'); line.className = 'timeline-line'; profileDiv.appendChild(line);
        const isConsecutive = msgSenderUID === lastSenderUID;
        if (isConsecutive) { rowDiv.classList.add('consecutive'); if(lastRowElement) { lastRowElement.classList.add('has-next'); } }
        
        const contentDiv = document.createElement('div'); contentDiv.className = 'msg-content';
        const nameBubble = document.createElement('span'); nameBubble.className = 'sender-name-bubble'; nameBubble.innerText = currentSenderName; contentDiv.appendChild(nameBubble);
        
        const bubbleDiv = document.createElement('div'); bubbleDiv.className = 'bubble';
        if (msgData.type === 'image') {
            const img = document.createElement('img'); img.src = msgData.message; img.className = 'chat-media'; img.onclick = () => window.open(msgData.message, '_blank'); bubbleDiv.appendChild(img);
        } else if (msgData.type === 'video') {
            const video = document.createElement('video'); video.src = msgData.message; video.className = 'chat-media'; video.controls = true; bubbleDiv.appendChild(video);
        } else { bubbleDiv.innerText = msgData.message; }
        
        contentDiv.appendChild(bubbleDiv);
        if (msgData.timestamp) {
            const timeDiv = document.createElement('div'); timeDiv.className = 'msg-time'; timeDiv.innerText = msgData.timestamp; contentDiv.appendChild(timeDiv);
        }
        
        rowDiv.appendChild(profileDiv); rowDiv.appendChild(contentDiv);
        messagesBox.appendChild(rowDiv); messagesBox.scrollTop = messagesBox.scrollHeight;
        
        lastSenderUID = msgSenderUID; lastRowElement = rowDiv;
    });
  }
</script>
</body>
</html>
