<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>යාලුවෝ Chat</title>
    <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    
    /* Login Screen */
    .login-container { width: 100%; max-width: 350px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .login-container h2 { color: #007bff; margin-bottom: 20px; }
    .login-container input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; outline: none; font-size: 1rem; box-sizing: border-box; }
    
    .auth-buttons { display: flex; flex-direction: column; gap: 10px; }
    .login-container button { width: 100%; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; }
    
    #startChatBtn { background: #007bff; color: white; }
    #startChatBtn:hover { background: #0056b3; }
    
    #signUpBtn { background: #28a745; color: white; }
    #signUpBtn:hover { background: #218838; }
    
    /* Chat Screen */
    .chat-container { width: 100%; max-width: 450px; height: 600px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 10px; display: none; flex-direction: column; overflow: hidden; margin: 10px; }
    .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    /* Message Row Block */
    .msg-row { display: flex; width: 100%; position: relative; margin-bottom: 10px; }
    .msg-row.incoming { justify-content: flex-start; }
    .msg-row.outgoing { flex-direction: row-reverse; }

    /* Profile Area */
    .profile-area { width: 42px; display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #007bff; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.95rem; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 3; }
    
    /* Timeline lines */
    .timeline-line { position: absolute; top: 0px; bottom: -18px; width: 3px; background: #cbd5e1; z-index: 1; display: none; }
    .msg-row.has-next .timeline-line { display: block; }
    .branch-line { display: none !important; }

    /* Content Area */
    .msg-content { max-width: 75%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-left: 8px; }
    .msg-row.outgoing .msg-content { align-items: flex-end; margin-left: 0; margin-right: 8px; }
    
    /* Name Bubble */
    .sender-name-bubble { font-size: 0.8rem; font-weight: bold; color: white; padding: 3px 8px; border-radius: 4px; background: #475569; z-index: 2; margin-bottom: 2px; }
    .msg-row.outgoing .sender-name-bubble { background: #334155; }
    .msg-row.consecutive .sender-name-bubble { display: none; }

    /* Message Bubble */
    .bubble { padding: 8px 14px; border-radius: 12px; font-size: 0.95rem; color: white; display: inline-block; word-wrap: break-word; z-index: 2; margin-top: 2px; }
    .msg-row.incoming .bubble { background: #6c757d; }
    .msg-row.outgoing .bubble { background: #007bff; }
    
    /* Media Display styles */
    .chat-media { max-width: 200px; max-height: 200px; border-radius: 8px; display: block; margin-top: 5px; cursor: pointer; }
    
    /* Consecutive adjustments */
    .msg-row.consecutive .profile-area .avatar { display: none; } 
    .msg-row.consecutive .msg-content { margin-top: -15px; }
    
    /* Message Time */
    .msg-time { font-size: 0.7rem; color: #888; margin-top: 2px; margin-bottom: 5px; }
    .msg-row.outgoing .msg-time { text-align: right; }

    /* Input Area Actions */
    .input-area { padding: 10px; display: flex; align-items: center; gap: 8px; background: #fff; border-top: 1px solid #ddd; }
    .action-btn { background: #e4e6eb; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
    .action-btn:hover { background: #d8dadf; }
    .send-btn { background: #007bff; color: white; font-weight: bold; }
    .send-btn:hover { background: #0056b3; }
</style>
</head>
<body>

<div class="login-container" id="loginScreen">
    <h2>යාලුවෝ Chat 💬</h2>
    <input type="email" id="emailInput" placeholder="ඔයාගේ Email එක ඇතුළත් කරන්න..." required>
    <input type="password" id="passwordInput" placeholder="මුද්‍රිත පදය (Password) ඇතුළත් කරන්න..." required>
    
    <div class="auth-buttons">
        <button id="startChatBtn">Log In වෙන්න</button>
        <button id="signUpBtn">අලුත් Account එකක් හදන්න (Sign Up)</button>
    </div>
</div>

<div class="chat-container" id="chatScreen">
    <div class="chat-header">යාලුවෝ Chat Box 💬</div>
    <div class="messages-box" id="messages"></div>
    
    <div class="input-area">
        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
        
        <button class="action-btn" id="attachBtn" title="Media Upload">📎</button>
        <button class="action-btn" id="camBtn" title="Open Camera">📷</button>
        
        <input type="text" id="messageInput" placeholder="මැසේජ් එකක් ලියන්න..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none;">
        <button class="action-btn send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdXSYW5R4zRhC2WIYvlRXjAPHftDvcB30",
    authDomain: "testing-1-fe6c8.firebaseapp.com",
    databaseURL: "https://testing-1-fe6c8-default-rtdb.firebaseio.com/",
    projectId: "testing-1-fe6c8",
    storageBucket: "testing-1-fe6c8.firebasestorage.app", 
    messagingSenderId: "111355439434",
    appId: "1:111355439434:web:7b2615b3b2064b6d4df9b3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app); 
  const auth = getAuth(app); 
  const messagesRef = ref(db, 'messages');

  // වැදගත්: දැනට ලොග් වෙලා ඉන්න පරිශීලකයාගේ විස්තර තබා ගැනීමට විචල්‍යයන්
  let currentUserUID = ""; 
  let myName = "";
  let lastSenderUID = ""; // නම වෙනුවට UID එකෙන් consecutive බලන්න වෙනස් කරන ලදි
  let lastRowElement = null;

  function getNameColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
    const colors = ['#dc3545', '#fd7e14', '#6f42c1', '#e83e8c', '#17a2b8', '#20c997', '#28a745'];
    return colors[Math.abs(hash) % colors.length];
  }

  const loginScreen = document.getElementById('loginScreen');
  const chatScreen = document.getElementById('chatScreen');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const startChatBtn = document.getElementById('startChatBtn');
  const signUpBtn = document.getElementById('signUpBtn'); 
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const messagesBox = document.getElementById('messages');
  
  const mediaInput = document.getElementById('mediaInput');
  const cameraInput = document.getElementById('cameraInput');
  const attachBtn = document.getElementById('attachBtn');
  const camBtn = document.getElementById('camBtn');

  // පේජ් එක ලෝඩ් වෙද්දීම කලින් ලොග් වී ඇත්දැයි බැලීම (Auto Login)
  onAuthStateChanged(auth, (user) => {
      if (user) {
          currentUserUID = user.uid; // දැනට ලොග් වුන කෙනාගේ ස්ථිර UID එක
          myName = user.email.split('@')[0].toLowerCase();
          loginScreen.style.display = "none";
          chatScreen.style.display = "flex";
          loadChatMessages(); // මැසේජ් ලෝඩ් කරන function එක ක්‍රියාත්මක කිරීම
      } else {
          loginScreen.style.display = "none"; // මුලින්ම ලොගින් ස්ක්‍රීන් එක විතරක් පෙන්වීමට
          setTimeout(() => { loginScreen.style.display = "block"; }, 100);
      }
  });

  // SIGN IN
  startChatBtn.addEventListener('click', () => {
     const email = emailInput.value.trim();
     const password = passwordInput.value.trim();

     if(email !== "" && password !== "") {
         startChatBtn.disabled = true;
         startChatBtn.innerText = "Loggin in... ⏳";

         signInWithEmailAndPassword(auth, email, password)
          .catch((error) => {
              console.error(error);
              alert("ඇතුළත් කළ Email හෝ Password වැරදියි! ❌");
              startChatBtn.disabled = false;
              startChatBtn.innerText = "Log In වෙන්න";
          });
     } else {
         alert("කරුණාකර Email සහ Password ඇතුළත් කරන්න!");
     }
  });

  // SIGN UP
  signUpBtn.addEventListener('click', () => {
     const email = emailInput.value.trim();
     const password = passwordInput.value.trim();

     if(email !== "" && password !== "") {
         if(password.length < 6) {
             alert("Password එකට අවම වශයෙන් අක්ෂර 6ක්වත් තියෙන්න ඕනේ!");
             return;
         }

         signUpBtn.disabled = true;
         signUpBtn.innerText = "Creating Account... ⏳";

         createUserWithEmailAndPassword(auth, email, password)
          .then(() => {
              alert("Account එක සාර්ථකව සෑදුවා! 🎉");
          })
          .catch((error) => {
              console.error(error);
              if (error.code === 'auth/email-already-in-use') {
                  alert("මේ Email එකෙන් දැනටමත් Account එකක් හදලයි තියෙන්නේ! ❌");
              } else {
                  alert("Account එක හදන්න බැරි වුණා: " + error.message);
              }
              signUpBtn.disabled = false;
              signUpBtn.innerText = "අලුත් Account එකක් හදන්න (Sign Up)";
          });
     } else {
         alert("Account එකක් හදන්න මුලින්ම Email සහ Password ඇතුළත් කරන්න!");
     }
  });

  // මැසේජ් එකක් යවද්දී UID එකත් එක්කම Database එකට දානවා
  function sendMessage() {
    const text = messageInput.value.trim();
    if (text !== "" && currentUserUID !== "") {
        push(messagesRef, {
            senderUID: currentUserUID, // අද්විතීය UID එක
            senderName: myName, // පෙන්වන්න ඕන නම
            message: text,
            type: "text",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        messageInput.value = "";
    }
  }

  async function handleFileUpload(file) {
    if (!file || currentUserUID === "") return;
    
    const fileType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'unknown';
    if (fileType === 'unknown') return;

    const loadingId = Date.now();
    messageInput.value = "Uploading file... ⏳";
    messageInput.disabled = true;

    try {
        const fileRef = sRef(storage, `chat_media/${loadingId}_${file.name}`);
        const snapshot = await uploadBytes(fileRef, file);
        const downloadURL = await getDownloadURL(snapshot.ref);

        push(messagesRef, {
            senderUID: currentUserUID,
            senderName: myName,
            message: downloadURL, 
            type: fileType,       
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    } catch (error) {
        console.error("Upload error: ", error);
    } finally {
        messageInput.value = "";
        messageInput.disabled = false;
        messageInput.focus();
    }
  }

  attachBtn.addEventListener('click', () => mediaInput.click());
  camBtn.addEventListener('click', () => cameraInput.click());

  mediaInput.addEventListener('change', (e) => { handleFileUpload(e.target.files[0]); e.target.value = ''; });
  cameraInput.addEventListener('change', (e) => { handleFileUpload(e.target.files[0]); e.target.value = ''; });

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  // මැසේජ් ඩිස්ප්ලේ කරන ලොජික් එක වෙනම function එකකට ගන්නා ලදි
  function loadChatMessages() {
    // ඩප්ලිකේට් නොවී තියාගන්න බොක්ස් එක ක්ලියර් කරමු
    messagesBox.innerHTML = "";
    lastSenderUID = "";
    lastRowElement = null;

    onChildAdded(messagesRef, (data) => {
        const msgData = data.val();
        
        // පරණ ඩේටාබේස් මැසේජ් වල senderUID නැතිනම්, පරණ ක්‍රමයට senderName බලයි
        const msgSenderUID = msgData.senderUID ? msgData.senderUID : msgData.sender;
        const currentSenderName = msgData.senderName ? msgData.senderName : msgData.sender;
        
        // වැදගත් 🎯: ලොග් වෙලා ඉන්න කෙනාගේ UID එකට සමානද කියා බලයි (දකුණු පැත්ත තීරණය කරන්නේ මෙතනින්)
        const isMe = msgSenderUID === currentUserUID;

        const rowDiv = document.createElement('div');
        rowDiv.className = `msg-row ${isMe ? 'outgoing' : 'incoming'}`;
        
        const profileDiv = document.createElement('div');
        profileDiv.className = 'profile-area';
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerText = currentSenderName.charAt(0).toUpperCase();
        if(!isMe) avatar.style.backgroundColor = getNameColor(currentSenderName.toLowerCase());
        profileDiv.appendChild(avatar);
        
        const line = document.createElement('div');
        line.className = 'timeline-line';
        profileDiv.appendChild(line);
        
        const isConsecutive = msgSenderUID === lastSenderUID;
        if (isConsecutive) {
            rowDiv.classList.add('consecutive');
            if(lastRowElement) { lastRowElement.classList.add('has-next'); }
        } else {
            rowDiv.classList.add('first-msg');
        }
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';
        
        const nameBubble = document.createElement('span');
        nameBubble.className = 'sender-name-bubble';
        nameBubble.innerText = currentSenderName;
        contentDiv.appendChild(nameBubble);
        
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bubble';

        if (msgData.type === 'image') {
            const img = document.createElement('img');
            img.src = msgData.message;
            img.className = 'chat-media';
            img.onclick = () => window.open(msgData.message, '_blank'); 
            bubbleDiv.appendChild(img);
        } else if (msgData.type === 'video') {
            const video = document.createElement('video');
            video.src = msgData.message;
            video.className = 'chat-media';
            video.controls = true; 
            bubbleDiv.appendChild(video);
        } else {
            bubbleDiv.innerText = msgData.message;
        }
        
        contentDiv.appendChild(bubbleDiv);

        if (msgData.timestamp) {
            const timeDiv = document.createElement('div');
            timeDiv.className = 'msg-time';
            timeDiv.innerText = msgData.timestamp;
            contentDiv.appendChild(timeDiv);
        }
        
        rowDiv.appendChild(profileDiv);
        rowDiv.appendChild(contentDiv);
        
        messagesBox.appendChild(rowDiv);
        messagesBox.scrollTop = messagesBox.scrollHeight;
        
        lastSenderUID = msgSenderUID;
        lastRowElement = rowDiv;
    });
  }
</script>
</body>
</html>
